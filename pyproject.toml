[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "foundation-lm"
version = "0.3.0"
description = "A small decoder-only transformer language model built with PyTorch."
requires-python = ">=3.11"
dependencies = ["torch>=2.0"]

[tool.setuptools.packages.find]
include = ["foundationlm*"]
